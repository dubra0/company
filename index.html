<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کۆمپانیای دووبرا - Dw Bra</title>
<link rel="preconnect" href="https://foplvmfppbngywmxmqof.supabase.co" crossorigin>
<style>
:root{--bg:#070b12;--card:#0f172a;--border:#1e3a8a;--glow:#3b82f6;--text:#f8fafc;--muted:#94a3b8;--accent:#2563eb;--btn-bg:#172554;--warn:#ef8a74;--warnsoft:#3a201b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Vazirmatn","Noto Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:440px;margin:0 auto;padding:24px 16px}
.top-box{text-align:center;margin-bottom:24px}
.logo-container{width:90px;height:90px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle, #1e3a8a 0%, #0f172a 70%);border:2px solid var(--glow);display:grid;place-items:center;box-shadow:0 0 20px rgba(59,130,246,0.4)}
.logo-inner{font-weight:900;font-size:22px;color:#fff;letter-spacing:1px}
.company-title{font-size:20px;font-weight:900;letter-spacing:1px;color:#fff;margin-top:8px}

.main-card{background:var(--card);border:2px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 0 30px rgba(30,58,138,0.3)}

.field-group{margin-bottom:16px}
.field-label{font-size:14px;color:var(--muted);margin-bottom:6px;display:block;text-align:right}

.field-row{display:flex;align-items:center;background:#0b1329;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.field-value{flex:1;padding:12px 14px;font-size:15px;color:#fff;word-break:break-word;background:transparent;border:0}

.copy-btn{background:var(--btn-bg);color:#93c5fd;border:0;border-right:1px solid var(--border);padding:0 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;height:100%;min-height:46px;transition:background 0.2s}
.copy-btn:hover{background:#1d4ed8;color:#fff}
.copy-btn.copied{background:#15803d;color:#fff}

.pill{display:inline-block;font-size:12px;padding:4px 12px;border-radius:99px;background:#172554;color:#60a5fa;font-weight:700;margin-bottom:16px;border:1px solid #1e3a8a}

.sk{height:20px;border-radius:6px;background:#1e293b;margin:14px 0;animation:p 1s infinite alternate}
@keyframes p{to{opacity:.4}}
.err{background:var(--warnsoft);color:var(--warn);font-weight:700;padding:20px;border-radius:16px;text-align:center;border:1px solid rgba(239,138,116,0.2)}
</style>
</head>
<body>
<div class="wrap" id="out">
  <div class="sk"></div><div class="sk"></div><div class="sk"></div>
</div>
<script>
const API='https://foplvmfppbngywmxmqof.supabase.co/rest/v1/rpc/scan';
const KEY='sb_publishable_HFxscwwTWxXEspJEnpJgFA_Ib4A5cAQ';
const DEFAULT_TPL=`<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کۆمپانیای دووبرا - Dw Bra</title>
<style>
:root{--bg:#070b12;--card:#0f172a;--border:#1e3a8a;--glow:#3b82f6;--text:#f8fafc;--muted:#94a3b8;--accent:#2563eb;--btn-bg:#172554}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Vazirmatn","Noto Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:440px;margin:0 auto;padding:24px 16px}
.top-box{text-align:center;margin-bottom:24px}
.logo-container{width:90px;height:90px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle, #1e3a8a 0%, #0f172a 70%);border:2px solid var(--glow);display:grid;place-items:center;box-shadow:0 0 20px rgba(59,130,246,0.4)}
.logo-inner{font-weight:900;font-size:22px;color:#fff;letter-spacing:1px}
.company-title{font-size:20px;font-weight:900;letter-spacing:1px;color:#fff;margin-top:8px}
.main-card{background:var(--card);border:2px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 0 30px rgba(30,58,138,0.3)}
.field-group{margin-bottom:16px}
.field-label{font-size:14px;color:var(--muted);margin-bottom:6px;display:block;text-align:right}
.field-row{display:flex;align-items:center;background:#0b1329;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.field-value{flex:1;padding:12px 14px;font-size:15px;color:#fff;word-break:break-word;background:transparent;border:0}
.copy-btn{background:var(--btn-bg);color:#93c5fd;border:0;border-right:1px solid var(--border);padding:0 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;height:100%;min-height:46px;transition:background 0.2s}
.copy-btn:hover{background:#1d4ed8;color:#fff}
.copy-btn.copied{background:#15803d;color:#fff}
.pill{display:inline-block;font-size:12px;padding:4px 12px;border-radius:99px;background:#172554;color:#60a5fa;font-weight:700;margin-bottom:16px;border:1px solid #1e3a8a}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-box">
    <div class="logo-container"><div class="logo-inner">DB</div></div>
    <div class="company-title">COMPANY DU BRA</div>
  </div>
  <div class="main-card">
    <span class="pill">{{status}}</span>
    {{rows}}
  </div>
  {{button}}
</div>
</body>
</html>`;

const REPORT_BTN='<div class="dubra-rep" style="margin-top:16px;display:grid;gap:8px">'+
  '<button type="button" data-rep-open style="width:100%;padding:12px;border-radius:12px;border:1px solid #3b82f6;background:#172554;color:#93c5fd;font:inherit;font-weight:700;cursor:pointer">زانیارییەکە هەڵەیە؟ داواکاری گۆڕین</button>'+
  '<div data-rep-form style="display:none;gap:8px">'+
  '<textarea data-rep-note maxlength="300" rows="3" placeholder="تێبینی..." style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #1e3a8a;font:inherit;resize:vertical;background:#0b1329;color:#fff"></textarea>'+
  '<button type="button" data-rep-send style="width:100%;padding:12px;border-radius:12px;border:0;background:#2563eb;color:#fff;font:inherit;font-weight:700;cursor:pointer">ناردنی داواکاری</button></div>'+
  '<p data-rep-msg style="margin:0;text-align:center;font-weight:700;font-size:14px"></p></div>';

function fillTpl(tpl,d){
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const h=d.headers||[], v=d.data||[];
  const customLabels = ['Apple ID', 'ئیمەیل (Email)', 'ڕێکەوتی لەدایکبوون', 'ژمارەی مۆبایل', 'کۆدی دڵنیایی'];
  
  const rows = v.map((x,i) => {
    if (x === null || String(x).trim() === '') return '';
    let valHtml = esc(x);
    let dirAttr = 'dir="ltr"';
    
    const label = esc(customLabels[i] || h[i] || ('زانیاری ' + (i + 1)));
    
    return `<div class="field-group">
      <span class="field-label">${label}</span>
      <div class="field-row">
        <div class="field-value" ${dirAttr}>${valHtml}</div>
        <button type="button" class="copy-btn" onclick="navigator.clipboard.writeText('${esc(x).replace(/'/g, "\\'")}');let b=this;b.textContent='کۆپی کرا';b.classList.add('copied');setTimeout(()=>{b.textContent='کۆپی';b.classList.remove('copied')},2000)">کۆپی</button>
      </div>
    </div>`;
  }).join('');

  const map={rows, status:d.first?'یەکەم جار سکان کرا':'پێشتر سکان کراوە', time:d.scanned_at, count:d.count, code:d.code};
  const raw={rows, button:REPORT_BTN};
  return tpl.replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>(k in raw)?raw[k]:(k in map?esc(map[k]):m));
}

function wireReport(){
  document.addEventListener('click',async e=>{
    const box=e.target.closest('.dubra-rep'); if(!box) return;
    const form=box.querySelector('[data-rep-form]'), msg=box.querySelector('[data-rep-msg]');
    if(e.target.closest('[data-rep-open]')){ form.style.display='grid'; e.target.closest('[data-rep-open]').style.display='none'; box.querySelector('[data-rep-note]').focus(); return; }
    const send=e.target.closest('[data-rep-send]'); if(!send||send.disabled) return;
    send.disabled=true; msg.style.color=''; msg.textContent='چاوەڕێ بکە...';
    try{
      const r=await fetch('https://foplvmfppbngywmxmqof.supabase.co/rest/v1/rpc/report_qr',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({p_code:code,p_note:box.querySelector('[data-rep-note]').value})}).then(r=>r.json());
      if(!r.ok) throw 0;
      form.style.display='none'; msg.style.color='#60a5fa';
      msg.textContent=r.already?'داواکارییەکەت پێشتر نێردراوە.':'✅ داواکارییەکەت نێردرا.';
    }catch(err){ send.disabled=false; msg.style.color='#ef8a74'; msg.textContent='نەنێردرا، دووبارە هەوڵ بدەرەوە.'; }
  });
}

const code=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase();
const fail=t=>{document.getElementById('out').innerHTML='<div class="err">'+t+'</div>'};
if(!code) fail('QR کۆدەکە دروست نییە.');
else fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({p_code:code})})
.then(r=>r.json()).then(d=>{
  if(!d.ok){fail(d.error==='empty'?'هیچ زانیارییەک بەردەست نییە.':'QR کۆدی هەڵە.');return}
  d.code=code;
  const html=fillTpl((d.tpl&&d.tpl.trim())?d.tpl:DEFAULT_TPL,d);
  document.open(); document.write(html); document.close();
  wireReport();
}).catch(()=>fail('کێشەی ئینتەرنێت هەیە.'));
</script>
</body>
</html>
